name: CI

on:
  push:
    branches: [main, staging, dev]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main, staging, dev]
    paths-ignore: ['docs/**', '**/*.md']

# A newer push to the same ref supersedes the in-flight run (never cancels main,
# whose CI result gates the deploy workflow).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build client
        run: npm run build --workspace client
        env:
          VITE_DISABLE_QUICK_LOGIN: 'true'

      - name: Syntax-check server
        run: node --check server/src/index.js

  test:
    name: test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Each shard has its own Postgres service container, so suites that TRUNCATE
    # shared tables can't collide across shards. Within a shard Jest still runs
    # --runInBand (suites share one DB).
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: requirement_dashboard_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run generate --workspace server

      - name: Apply migrations
        working-directory: server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5434/requirement_dashboard_test
        run: npx prisma migrate deploy

      - name: Run server tests
        working-directory: server
        run: npx jest --runInBand --ci --shard=${{ matrix.shard }}/4

  docker-smoke:
    name: Docker compose smoke (login)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Slowest job; it only guards image/compose wiring, so run it on pushes to
    # the integration branches, not on every PR commit. It has no `needs`, so
    # it runs in parallel with build/test.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Layer cache in the GitHub Actions cache: install layers only rebuild
      # when a package.json changes.
      - name: Build images (cached)
        uses: docker/bake-action@v5
        with:
          files: docker-compose.yml
          load: true
          set: |
            server.cache-from=type=gha,scope=server
            server.cache-to=type=gha,scope=server,mode=max
            client.cache-from=type=gha,scope=client
            client.cache-to=type=gha,scope=client,mode=max

      - name: Start stack
        run: docker compose up -d
        env:
          JWT_ACCESS_SECRET: ci_access_secret_32chars_minimum_xx
          JWT_REFRESH_SECRET: ci_refresh_secret_32chars_minimum_x
          CORS_ORIGIN: http://localhost:8081

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/api/v1/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            echo "waiting for API… ($i)"
            sleep 5
          done
          echo "API did not become healthy"
          docker compose logs --no-color
          exit 1

      # On an empty DB the backfill migration is a no-op, so the Delphic org the
      # seed needs doesn't exist yet. phase0-backfill.js is idempotent: before the
      # seed it creates the org, after it gives the seeded users memberships.
      - name: Seed demo users
        run: |
          docker compose exec -T server node prisma/erp/phase0-backfill.js
          docker compose exec -T server node prisma/seed.js
          docker compose exec -T server node prisma/erp/phase0-backfill.js

      - name: Login smoke
        run: |
          RESP=$(curl -sf -X POST http://localhost:4000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@delphic.in","password":"Password123!"}')
          echo "$RESP" | grep -q '"success":true'
          echo "$RESP" | grep -q 'access_token'
          echo "Login OK"

      - name: Client proxy smoke
        run: |
          curl -sf -o /dev/null -w "%{http_code}" http://localhost:8081/ | grep -E '200|304'
          curl -sf -X POST http://localhost:8081/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@delphic.in","password":"Password123!"}' \
            | grep -q '"success":true'
          echo "Client proxy login OK"

      - name: Tear down
        if: always()
        run: docker compose down -v
