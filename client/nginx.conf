server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted build assets (Vite emits assets/<name>-<hash>.<ext>) — safe to
    # cache forever; the filename changes on every content change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a browser holding the old copy after a
    # deploy will request a JS bundle hash that no longer exists → blank page.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        proxy_pass http://server:4000;
    }
}
